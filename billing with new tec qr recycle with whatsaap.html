<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBill Pro - Direct Working</title>
    <!-- Real QR Code Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .control-panel { background: #ffffff; padding: 18px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 950px; margin: 0 auto 25px auto; border: 1px solid #e1e4e8; }
        .panel-header { font-size: 16px; font-weight: 700; color: #1a365d; margin-bottom: 15px; border-bottom: 2px solid #edf2f7; padding-bottom: 12px; }
        .form-grid { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; font-weight: 700; color: #4a5568; text-transform: uppercase; margin-bottom: 4px; }
        input, select, button { padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; outline: none; }
        .btn-add { background-color: #2b6cb0; color: white; font-weight: 600; cursor: pointer; border: none; height: 38px; align-self: flex-end; }
        .btn-voice { background-color: #805ad5; color: white; font-weight: 600; cursor: pointer; border: none; height: 38px; align-self: flex-end; border-radius: 6px; padding: 0 12px; }
        .btn-whatsapp { background-color: #25d366; color: white; font-weight: 700; font-size: 13px; cursor: pointer; border: none; padding: 8px 14px; border-radius: 6px; }
        .btn-print { background-color: #2f855a; color: white; font-weight: 700; font-size: 13px; cursor: pointer; border: none; padding: 8px 14px; border-radius: 6px; }
        .btn-clear { background-color: #e53e3e; color: white; font-weight: 600; cursor: pointer; border: none; padding: 8px 14px; border-radius: 6px; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .invoice-container { background: #ffffff; margin: 0 auto 20px auto; padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 5in; min-height: 6.8in; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .estimate-heading { text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 6px; text-transform: uppercase; color: #000; }
        .invoice-header { display: flex; justify-content: space-between; border-bottom: 1.5px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
        .invoice-table th { background-color: #f0f0f0; color: #000; font-weight: 700; text-transform: uppercase; padding: 4px 6px; border-bottom: 1.5px solid #000; text-align: left; }
        .invoice-table td { padding: 4px 6px; border-bottom: 1px solid #ccc; color: #000; }
        .text-right { text-align: right !important; }
        .text-center { text-align: center !important; }
        .invoice-summary { display: flex; justify-content: flex-end; margin-top: 6px; }
        .summary-box { width: 100%; max-width: 320px; border: 1.5px solid #000; border-radius: 4px; padding: 6px; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; font-weight: bold; }
        .footer-section { margin-top: auto; border-top: 1px solid #ccc; padding-top: 6px; display: flex; justify-content: space-between; align-items: flex-end; }
        .qr-code-box { display: flex; align-items: center; justify-content: center; background: #fff; padding: 4px; border: 1px solid #000; width: 65px; height: 65px; }
        @media print {
            body { background: white !important; padding: 0 !important; }
            .control-panel { display: none !important; }
            .invoice-container { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="panel-header">
            <span>⚙️ Billing Control Panel (Direct Mode)</span>
        </div>

        <div class="form-grid">
            <div class="form-group" style="flex: 1.5; min-width: 150px;">
                <label>Customer Phone No</label>
                <input type="text" id="custPhoneInput" placeholder="E.g. 9700271634" oninput="document.getElementById('billCustPhone').innerText = this.value || '0';">
            </div>
            <div class="form-group" style="flex: 2; min-width: 180px;">
                <label>Item Ka Naam</label>
                <input type="text" id="itemName" placeholder="E.g. Ring, Chain...">
            </div>
            <div class="form-group" style="flex: 1; min-width: 80px;">
                <label>Qty</label>
                <input type="number" id="itemQty" value="1" min="0.01" step="any">
            </div>
            <div class="form-group" style="flex: 1; min-width: 90px;">
                <label>Unit</label>
                <select id="itemUnit">
                    <option value="pcs">pcs</option>
                    <option value="gms">gms</option>
                    <option value="lines">lines</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1; min-width: 90px;">
                <label>Rate (₹)</label>
                <input type="number" id="itemPrice" placeholder="0.00" min="0" step="any">
            </div>
            <div class="form-group" style="display: flex; gap: 6px;">
                <button type="button" class="btn-voice" onclick="startVoice()">🎤 Speak</button>
                <button type="button" class="btn-add" onclick="addItemDirect()">+ Add Item</button>
            </div>
        </div>

        <div class="action-bar">
            <button type="button" class="btn-clear" onclick="clearBillDirect()">🗑️ Reset Bill</button>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button type="button" class="btn-whatsapp" onclick="sendWhatsApp()">⚡ WhatsApp</button>
                <button type="button" class="btn-print" onclick="printBill()">🖨️ Print Invoice</button>
            </div>
        </div>
    </div>

    <div id="invoice" class="invoice-container">
        <div>
            <div class="estimate-heading">ESTIMATE</div>

            <div class="invoice-header">
                <div class="company-details">
                    <h1 contenteditable="true" style="margin:0; font-size:16px;">CASH</h1>
                    <p contenteditable="true" style="margin:2px 0;">Phone: 0</p>
                    <p style="margin:2px 0;">Customer Phone: <span id="billCustPhone">0</span></p>
                </div>
                <div style="text-align: right;">
                    <p style="margin:2px 0;"><strong>INVOICE NO:</strong> <span id="billNoDisplay">#1</span></p>
                    <p style="margin:2px 0;"><strong>DATE:</strong> <span id="billDate"></span></p>
                </div>
            </div>

            <table class="invoice-table">
                <thead>
                    <tr>
                        <th style="width: 6%;">S.No</th>
                        <th>Item Description</th>
                        <th class="text-center" style="width: 12%;">Qty</th>
                        <th class="text-center" style="width: 12%;">Unit</th>
                        <th class="text-right" style="width: 18%;">Rate (₹)</th>
                        <th class="text-right" style="width: 20%;">Total (₹)</th>
                        <th style="width: 10%; text-align:center;">Action</th>
                    </tr>
                </thead>
                <tbody id="billBody">
                    <tr><td colspan="7" style="text-align:center; color:#718096; padding:10px;">No items added yet.</td></tr>
                </tbody>
            </table>

            <div class="invoice-summary">
                <div class="summary-box">
                    <div class="summary-row">
                        <span>Grand Total:</span>
                        <span>₹<span id="grandTotal">0.00</span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-section">
            <p style="margin:0;">Thank you for your business!</p>
            <div id="qrcodeBox" class="qr-code-box"></div>
        </div>
    </div>

    <script>
        let cartItems = [];

        // Set date on load
        document.getElementById('billDate').innerText = new Date().toLocaleDateString('en-GB');

        // Generate QR code directly
        if (typeof QRCode !== "undefined") {
            new QRCode(document.getElementById("qrcodeBox"), {
                text: "upi://pay?pa=vickey1634@ybl&pn=vikram",
                width: 55,
                height: 55
            });
        }

        function addItemDirect() {
            const name = document.getElementById('itemName').value.trim();
            const qty = parseFloat(document.getElementById('itemQty').value) || 1;
            const unit = document.getElementById('itemUnit').value;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;

            if (!name) {
                alert('Kripya item ka naam daalein!');
                document.getElementById('itemName').focus();
                return;
            }

            cartItems.push({ name, qty, unit, price, total: qty * price });
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '1';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemName').focus();

            renderTable();
        }

        function removeItemDirect(index) {
            cartItems.splice(index, 1);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('billBody');
            tbody.innerHTML = '';
            let totalSum = 0;

            if (cartItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#718096; padding:10px;">No items added yet.</td></tr>`;
            } else {
                cartItems.forEach((item, idx) => {
                    totalSum += item.total;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td>${item.name}</td>
                        <td class="text-center">${item.qty}</td>
                        <td class="text-center">${item.unit}</td>
                        <td class="text-right">₹${item.price.toFixed(2)}</td>
                        <td class="text-right">₹${item.total.toFixed(2)}</td>
                        <td class="text-center"><button type="button" onclick="removeItemDirect(${idx})" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">❌</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('grandTotal').innerText = totalSum.toFixed(2);
        }

        function clearBillDirect() {
            if (confirm('Poora bill clear karna hai?')) {
                cartItems = [];
                document.getElementById('custPhoneInput').value = '';
                document.getElementById('billCustPhone').innerText = '0';
                renderTable();
            }
        }

        function printBill() {
            window.print();
        }

        function sendWhatsApp() {
            let phone = document.getElementById('custPhoneInput').value.trim();
            if(!phone) phone = prompt("Customer Phone Number:");
            if(!phone) return;
            alert("WhatsApp message ready for number: " + phone);
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice recognition support nahi hai is browser mein.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onresult = function(event) {
                document.getElementById('itemName').value = event.results[0][0].transcript;
            };
            recognition.start();
        }
    </script>
</body>
</html>
